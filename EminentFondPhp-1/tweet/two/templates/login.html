<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tweetify &mdash; Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f1117;
      color: #e7e9ea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    /* ── Brand ── */
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand i {
      font-size: 42px;
      color: #1d9bf0;
    }
    .brand h1 {
      font-size: 26px;
      font-weight: 700;
      margin-top: 10px;
      color: #e7e9ea;
    }
    .brand p {
      font-size: 14px;
      color: #8b98a5;
      margin-top: 6px;
    }

    /* ── Card ── */
    .card {
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 20px;
      padding: 36px 32px;
    }

    /* ── Alert ── */
    .alert {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(244, 33, 46, 0.12);
      border: 1px solid rgba(244, 33, 46, 0.35);
      color: #f4212e;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 22px;
    }

    /* ── Fields ── */
    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #8b98a5;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
    }
    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #3d4348;
      font-size: 15px;
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 13px 16px 13px 42px;
      background: #0f1117;
      border: 1px solid #2f3336;
      border-radius: 10px;
      color: #e7e9ea;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #1d9bf0;
      box-shadow: 0 0 0 3px rgba(29, 155, 240, 0.15);
    }
    input::placeholder { color: #3d4348; }

    /* ── Button ── */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.18s, transform 0.12s;
    }
    .btn-submit:hover { background: #1a8cd8; }
    .btn-submit:active { transform: scale(0.98); }

    /* ── Footer ── */
    .card-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #8b98a5;
    }
    .card-footer a {
      color: #1d9bf0;
      text-decoration: none;
      font-weight: 600;
    }
    .card-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <div class="brand">
    <i class="fa-brands fa-twitter"></i>
    <h1>Tweetify</h1>
    <p>Sign in to continue</p>
  </div>

  <div class="card">
    {% if error %}
      <div class="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ error }}
      </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-right-to-bracket"></i> &nbsp;Sign In
      </button>
    </form>

    <div class="card-footer">
      <a href="{% url 'index' %}"><i class="fa-solid fa-arrow-left"></i> Back to Feed</a>
    </div>
  </div>
</div>

</body>
</html>
